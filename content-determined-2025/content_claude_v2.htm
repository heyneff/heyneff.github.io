<!DOCTYPE html>

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            max-height: 80vh;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #content-svg {
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;

    </style>
</head>
