<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DETERMINED</title>
<style>
  :root {
    --bg: #111;         /* dark gray background */
    --fg: #eee;         /* inverse word color */
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
  }
  /* Keep the word within 80% of viewport width/height */
  svg.word {
    width: min(80vw, 80vh);
    height: auto;
    max-height: 80vh;
    display: block;
  }
  /* Crisp edges for the vector shapes */
  .glyph * { shape-rendering: geometricPrecision; }
</style>
</head>
<body>
  <!--
    Constructed, condensed sans glyphs built from rectangles, polygons, and paths.
    ViewBox units: width 1150, height 200. Stroke-less, filled shapes only.
  -->
  <svg class="word" viewBox="0 0 1150 200" aria-labelledby="title desc" role="img">
    <title id="title">DETERMINED</title>
    <desc id="desc">Inline SVG rendering of the word DETERMINED in a condensed geometric style.</desc>

    <!-- Common fill -->
    <defs>
      <style>
        .fill { fill: #eee; }
      </style>
    </defs>

    <!-- Metrics used when drawing (not variables in SVG, just notes):
         H=200, S=28 (stroke/thickness), G=20 (letter gap)
    -->

    <!-- D (w=110) -->
    <g class="glyph" transform="translate(0,0)">
      <path class="fill" fill-rule="evenodd"
        d="
          M 0 0 L 82 0
          A 100 100 0 0 1 82 200
          L 0 200 Z

          M 28 28 L 54 28
          A 72 72 0 0 1 54 172
          L 28 172 Z
        " />
    </g>

    <!-- E (w=90) -->
    <g class="glyph" transform="translate(130,0)">
      <!-- vertical -->
      <rect class="fill" x="0" y="0" width="28" height="200"/>
      <!-- top -->
      <rect class="fill" x="0" y="0" width="90" height="28"/>
      <!-- middle (slightly shorter for condensed feel) -->
      <rect class="fill" x="0" y="86" width="64" height="28"/>
      <!-- bottom -->
      <rect class="fill" x="0" y="172" width="90" height="28"/>
    </g>

    <!-- T (w=90) -->
    <g class="glyph" transform="translate(240,0)">
      <!-- top bar -->
      <rect class="fill" x="0" y="0" width="90" height="28"/>
      <!-- stem -->
      <rect class="fill" x="31" y="0" width="28" height="200"/>
    </g>

    <!-- E (w=90) -->
    <g class="glyph" transform="translate(350,0)">
      <rect class="fill" x="0" y="0" width="28" height="200"/>
      <rect class="fill" x="0" y="0" width="90" height="28"/>
      <rect class="fill" x="0" y="86" width="64" height="28"/>
      <rect class="fill" x="0" y="172" width="90" height="28"/>
    </g>

    <!-- R (w=100) -->
    <g class="glyph" transform="translate(460,0)">
      <!-- stem -->
      <rect class="fill" x="0" y="0" width="28" height="200"/>
      <!-- top bar -->
      <rect class="fill" x="0" y="0" width="100" height="28"/>
      <!-- right of bowl -->
      <rect class="fill" x="72" y="0" width="28" height="100"/>
      <!-- mid bar -->
      <rect class="fill" x="0" y="86" width="72" height="28"/>
      <!-- diagonal leg -->
      <polygon class="fill" points="28,120 58,120 100,200 72,200" />
    </g>

    <!-- M (w=140) -->
    <g class="glyph" transform="translate(580,0)">
      <!-- left stem -->
      <rect class="fill" x="0" y="0" width="28" height="200"/>
      <!-- right stem -->
      <rect class="fill" x="112" y="0" width="28" height="200"/>
      <!-- left diagonal -->
      <polygon class="fill" points="28,200 28,0 56,0 70,76"/>
      <!-- right diagonal -->
      <polygon class="fill" points="112,200 112,0 84,0 70,76"/>
    </g>

    <!-- I (w=30) -->
    <g class="glyph" transform="translate(740,0)">
      <rect class="fill" x="1" y="0" width="28" height="200"/>
    </g>

    <!-- N (w=120) -->
    <g class="glyph" transform="translate(790,0)">
      <!-- left stem -->
      <rect class="fill" x="0" y="0" width="28" height="200"/>
      <!-- right stem -->
      <rect class="fill" x="92" y="0" width="28" height="200"/>
      <!-- diagonal fill -->
      <polygon class="fill" points="28,0 56,0 120,200 92,200"/>
    </g>

    <!-- E (w=90) -->
    <g class="glyph" transform="translate(930,0)">
      <rect class="fill" x="0" y="0" width="28" height="200"/>
      <rect class="fill" x="0" y="0" width="90" height="28"/>
      <rect class="fill" x="0" y="86" width="64" height="28"/>
      <rect class="fill" x="0" y="172" width="90" height="28"/>
    </g>

    <!-- D (w=110) -->
    <g class="glyph" transform="translate(1040,0)">
      <path class="fill" fill-rule="evenodd"
        d="
          M 0 0 L 82 0
          A 100 100 0 0 1 82 200
          L 0 200 Z

          M 28 28 L 54 28
          A 72 72 0 0 1 54 172
          L 28 172 Z
        " />
    </g>
  </svg>
</body>
</html>
