<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbridled Joy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c2c2c; /* A shade of black */
            overflow: hidden;
            font-family: sans-serif; /* Fallback font */
        }

        .svg-container {
            width: 80vw;
            max-width: 80vh; /* Ensures the SVG doesn't get too tall */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .unbridled-joy {
            display: flex;
            width: 100%;
            height: auto;
            color: #d3d3d3; /* A shade of white, inverse of the background */
            font-weight: 700;
        }

        .unbridled-joy svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg class="unbridled-joy" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMid meet">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="150" font-family="'Trade Gothic Bold Condensed #20', Arial, sans-serif" font-weight="bold" fill="currentColor">
            UNBRIDLED JOY
        </text>
    </svg>
</div>

</body>
</html>
