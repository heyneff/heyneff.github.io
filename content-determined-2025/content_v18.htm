<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CONTENT</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #222222; /* dark gray */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .content-logo {
      width: 80vw;      /* 80% of viewport width */
      max-height: 80vh; /* no more than 80% of viewport height */
      display: block;
    }
  </style>
</head>
<body>
  <!-- Inline SVG vectors approximating Trade Gothic Bold Condensed #20 -->
  <svg class="content-logo" viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
    <g fill="#EEEEEE"> <!-- inverse of dark background -->

      <!-- C -->
      <g transform="translate(0,0)">
        <rect x="0"  y="0"   width="20" height="200" />
        <rect x="20" y="0"   width="60" height="30" />
        <rect x="20" y="170" width="60" height="30" />
      </g>

      <!-- O -->
      <g transform="translate(90,0)">
        <rect x="0"  y="0"   width="20" height="200" />
        <rect x="60" y="0"   width="20" height="200" />
        <rect x="20" y="0"   width="40" height="30" />
        <rect x="20" y="170" width="40" height="30" />
      </g>

      <!-- N -->
      <g transform="translate(180,0)">
        <rect x="0"  y="0"   width="20" height="200" />
        <rect x="60" y="0"   width="20" height="200" />
        <!-- Diagonal bar -->
        <polygon points="20,0 40,0 60,200 40,200" />
      </g>

      <!-- T -->
      <g transform="translate(270,0)">
        <rect x="0"  y="0"   width="80" height="30" />
        <rect x="30" y="0"   width="20" height="200" />
      </g>

      <!-- E -->
      <g transform="translate(360,0)">
        <rect x="0"  y="0"   width="20" height="200" />
        <rect x="20" y="0"   width="60" height="30" />
        <rect x="20" y="85"  width="50" height="30" />
        <rect x="20" y="170" width="60" height="30" />
      </g>

      <!-- N -->
      <g transform="translate(450,0)">
        <rect x="0"  y="0"   width="20" height="200" />
        <rect x="60" y="0"   width="20" height="200" />
        <!-- Diagonal bar -->
        <polygon points="20,0 40,0 60,200 40,200" />
      </g>

      <!-- T -->
      <g transform="translate(540,0)">
        <rect x="0"  y="0"   width="80" height="30" />
        <rect x="30" y="0"   width="20" height="200" />
      </g>

    </g>
  </svg>
</body>
</html>
