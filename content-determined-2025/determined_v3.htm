<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DETERMINED</title>
  <style>
    :root {
      --bg: #222;     /* dark gray */
      --fg: #fff;     /* inverse of background */
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;            /* centers horizontally + vertically */
    }
    .wrap {
      /* Keep the word within 80% of both viewport dimensions */
      max-width: 80vw;
      max-height: 80vh;
      width: 100%;
      height: auto;
      display: grid;
      place-items: center;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      fill: var(--fg);
    }
    /* Better rendering on some browsers */
    svg, svg * {
      shape-rendering: geometricPrecision;
      text-rendering: geometricPrecision;
    }
  </style>
</head>
<body>
  <div class="wrap" aria-label="The word DETERMINED in a condensed bold sans style">
    <!--
      Inline SVG, letters drawn as vector shapes.
      Metrics (per glyph design space): height=1000 units, condensed widths.
      ViewBox width sums all glyph advances + letter spacing.
    -->
    <svg viewBox="0 0 7240 1000" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
      <title id="title">DETERMINED</title>
      <desc id="desc">Condensed bold, vector-drawn letters centered on a dark gray background.</desc>

      <defs>
        <!-- Common metrics -->
        <!-- H = 1000, stem S = 220, spacing = 60 -->

        <!-- D -->
        <symbol id="glyph-D" viewBox="0 0 720 1000">
          <!-- Outer and inner paths using evenodd to create counter -->
          <path fill-rule="evenodd" d="
            M0,0 L480,0
            Q700,0 700,220
            L700,780
            Q700,1000 480,1000
            L0,1000 Z

            M220,200 L430,200
            Q520,200 520,500
            Q520,800 430,800
            L220,800 Z
          " />
        </symbol>

        <!-- E -->
        <symbol id="glyph-E" viewBox="0 0 720 1000">
          <rect x="0" y="0" width="220" height="1000" />
          <rect x="0" y="0" width="620" height="220" rx="0" />
          <rect x="0" y="390" width="460" height="220" />
          <rect x="0" y="780" width="620" height="220" />
        </symbol>

        <!-- T -->
        <symbol id="glyph-T" viewBox="0 0 720 1000">
          <rect x="0" y="0" width="720" height="220" />
          <rect x="250" y="0" width="220" height="1000" />
        </symbol>

        <!-- R -->
        <symbol id="glyph-R" viewBox="0 0 720 1000">
          <!-- Left stem -->
          <rect x="0" y="0" width="220" height="1000" />
          <!-- Upper bowl with counter -->
          <path fill-rule="evenodd" d="
            M220,0 L460,0
            Q700,0 700,240
            Q700,460 460,480
            L220,480 Z

            M220,200 L430,200
            Q520,200 520,250
            Q520,330 430,360
            L220,360 Z
          "/>
          <!-- Diagonal leg -->
          <polygon points="220,520 420,520 700,1000 500,1000 220,610" />
        </symbol>

        <!-- M -->
        <symbol id="glyph-M" viewBox="0 0 720 1000">
          <polygon points="
            0,1000 0,0 220,0 350,460 500,0 720,0 720,1000 500,1000 500,420
            350,840 220,420 220,1000
          " />
        </symbol>

        <!-- I -->
        <symbol id="glyph-I" viewBox="0 0 220 1000">
          <rect x="0" y="0" width="220" height="1000" />
        </symbol>

        <!-- N -->
        <symbol id="glyph-N" viewBox="0 0 720 1000">
          <polygon points="
            0,1000 0,0 220,0 220,630 500,0 720,0 720,1000 500,1000 500,370 220,1000
          " />
        </symbol>
      </defs>

      <!-- Compose the word: D E T E R M I N E D -->
      <!-- Track spacing between glyphs: 60 units -->
      <g id="word" transform="translate(0,0)">
        <g transform="translate(0,0)"><use href="#glyph-D"/></g>
        <g transform="translate(780,0)"><use href="#glyph-E"/></g>
        <g transform="translate(1560,0)"><use href="#glyph-T"/></g>
        <g transform="translate(2340,0)"><use href="#glyph-E"/></g>
        <g transform="translate(3120,0)"><use href="#glyph-R"/></g>
        <g transform="translate(3900,0)"><use href="#glyph-M"/></g>
        <g transform="translate(4680,0)"><use href="#glyph-I"/></g>
        <g transform="translate(4960,0)"><use href="#glyph-N"/></g>
        <g transform="translate(5740,0)"><use href="#glyph-E"/></g>
        <g transform="translate(6520,0)"><use href="#glyph-D"/></g>
      </g>
    </svg>
  </div>
</body>
</html>
