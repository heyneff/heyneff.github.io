<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CONTENT</title>
  <style>
    :root {
      --bg: #111111;           /* dark gray background */
      --fg: #f2f2f2;           /* inverse (light) for the word */
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--bg);
      display: grid;
      place-items: center;      /* centers horizontally & vertically */
    }
    .wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    svg {
      display: block;
      max-width: 80vw;
      max-height: 80vh;
    }
  </style>
</head>
<body>
  <div class="wrap" role="img" aria-label="Word CONTENT in bold condensed block lettering">
    <!--
      Inline SVG vectors approximating a bold condensed grotesque (akin to Trade Gothic Bold Condensed).
      Geometry is drawn in a 700x500 viewBox (each letter ~100w with 10 units spacing).
    -->
    <svg viewBox="0 0 710 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="var(--fg)">
        <!-- C -->
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="90" height="60" rx="6" ry="6"/>
          <rect x="0" y="220" width="90" height="60" rx="6" ry="6"/>
          <rect x="0" y="0" width="60" height="280" rx="6" ry="6"/>
        </g>

        <!-- O (drawn with even-odd fill to create a counter) -->
        <g transform="translate(100,0)">
          <path d="M0,0 h90 v280 h-90 z
                   M20,40 h50 v200 h-50 z" fill-rule="evenodd"/>
        </g>

        <!-- N -->
        <g transform="translate(210,0)">
          <rect x="0" y="0" width="30" height="280" rx="6" ry="6"/>
          <rect x="60" y="0" width="30" height="280" rx="6" ry="6"/>
          <polygon points="0,0 30,0 90,280 60,280" />
        </g>

        <!-- T -->
        <g transform="translate(320,0)">
          <rect x="0" y="0" width="90" height="60" rx="6" ry="6"/>
          <rect x="30" y="0" width="30" height="280" rx="6" ry="6"/>
        </g>

        <!-- E -->
        <g transform="translate(430,0)">
          <rect x="0" y="0" width="30" height="280" rx="6" ry="6"/>
          <rect x="0" y="0" width="90" height="60" rx="6" ry="6"/>
          <rect x="0" y="110" width="80" height="60" rx="6" ry="6"/>
          <rect x="0" y="220" width="90" height="60" rx="6" ry="6"/>
        </g>

        <!-- N -->
        <g transform="translate(540,0)">
          <rect x="0" y="0" width="30" height="280" rx="6" ry="6"/>
          <rect x="60" y="0" width="30" height="280" rx="6" ry="6"/>
          <polygon points="0,0 30,0 90,280 60,280" />
        </g>

        <!-- T -->
        <g transform="translate(650,0)">
          <rect x="0" y="0" width="60" height="60" rx="6" ry="6"/>
          <rect x="15" y="0" width="30" height="280" rx="6" ry="6"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
