<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CONTENT</title>
  <style>
    :root {
      --bg: #222222;
      --fg: #dddddd; /* approximate inverse of bg */
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word {
      width: 80vw;
      max-height: 80vh;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Inline SVG "CONTENT" approximating a Trade Gothic Bold Condensed style -->
  <svg
    class="word"
    viewBox="0 0 700 200"
    xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="xMidYMid meet"
  >
    <!-- C -->
    <g fill="#dddddd" transform="translate(0,0)">
      <!-- slot width 80, letter inset 10 -->
      <rect x="10" y="20" width="20" height="160" />
      <rect x="30" y="20" width="40" height="20" />
      <rect x="30" y="160" width="40" height="20" />
    </g>

    <!-- O -->
    <g fill="#dddddd" transform="translate(100,0)">
      <!-- Outer rect minus inner rect using evenodd fill rule -->
      <path
        fill-rule="evenodd"
        d="
          M 10 20
          H 70
          V 180
          H 10
          Z
          M 25 35
          V 165
          H 55
          V 35
          Z
        "
      />
    </g>

    <!-- N -->
    <g fill="#dddddd" transform="translate(200,0)">
      <!-- Left vertical -->
      <rect x="10" y="20" width="20" height="160" />
      <!-- Right vertical -->
      <rect x="50" y="20" width="20" height="160" />
      <!-- Diagonal -->
      <path
        d="
          M 30 20
          L 50 20
          L 30 180
          L 10 180
          Z
        "
      />
    </g>

    <!-- T -->
    <g fill="#dddddd" transform="translate(300,0)">
      <!-- Top bar -->
      <rect x="10" y="20" width="60" height="20" />
      <!-- Stem -->
      <rect x="30" y="40" width="20" height="140" />
    </g>

    <!-- E -->
    <g fill="#dddddd" transform="translate(400,0)">
      <!-- Left vertical -->
      <rect x="10" y="20" width="20" height="160" />
      <!-- Top bar -->
      <rect x="30" y="20" width="40" height="20" />
      <!-- Middle bar -->
      <rect x="30" y="90" width="35" height="20" />
      <!-- Bottom bar -->
      <rect x="30" y="160" width="40" height="20" />
    </g>

    <!-- N (second) -->
    <g fill="#dddddd" transform="translate(500,0)">
      <!-- Left vertical -->
      <rect x="10" y="20" width="20" height="160" />
      <!-- Right vertical -->
      <rect x="50" y="20" width="20" height="160" />
      <!-- Diagonal -->
      <path
        d="
          M 30 20
          L 50 20
          L 30 180
          L 10 180
          Z
        "
      />
    </g>

    <!-- T (second) -->
    <g fill="#dddddd" transform="translate(600,0)">
      <!-- Top bar -->
      <rect x="10" y="20" width="60" height="20" />
      <!-- Stem -->
      <rect x="30" y="40" width="20" height="140" />
    </g>
  </svg>
</body>
</html>
