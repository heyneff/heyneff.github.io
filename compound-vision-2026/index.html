<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offset Video Wall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Video tiles">
    <p id="placeholder">Paste a video URL to begin.</p>
    <div id="tiles"></div>
    <p id="message" role="alert" hidden></p>
  </main>

  <div id="controls">
    <div class="row">
      <input id="url" type="url" placeholder="https://example.com/video.mp4" aria-label="Video URL">
      <button id="load" type="button">Load</button>
    </div>
    <div class="row">
      <label>Step (s) <input id="step" type="number" min="0" step="0.05" value="0.5"></label>
      <label>Tiles <input id="count" type="number" min="1" max="36" value="9"></label>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
      <button id="play" type="button">Play</button>
      <button id="reshuffle" type="button">Reshuffle</button>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
    <p class="hint">Space play/pause · F fullscreen · R reshuffle · +/− tiles · H hide controls</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
