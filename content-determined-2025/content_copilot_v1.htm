<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTENT</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Dark background */
            color: #ffffff; /* Inverse color */
            overflow: hidden;
        }

        svg {
            width: 80vw; /* Max width 80% of viewport */
            height: 80vh; /* Max height 80% of viewport */
        }

        text {
            font-family: 'Trade Gothic Bold Condensed #20', sans-serif;
            font-size: 80px;
            fill: currentColor;
            dominant-baseline: middle;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 100 20" xmlns="http://www.w3.org/2000/svg">
        <text x="50" y="10">CONTENT</text>
    </svg>
</body>
</html>
