<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CONTENT</title>
  <style>
    :root {
      --bg: #222222;
      --fg: #f5f5f5; /* inverse of dark background */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .word-wrapper {
      width: 80vw;
      max-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: auto;
      max-height: 100%;
      display: block;
      shape-rendering: geometricPrecision;
    }
  </style>
</head>
<body>
  <div class="word-wrapper">
    <!-- Inline SVG “CONTENT” in a condensed, bold, grotesk style -->
    <svg viewBox="0 0 800 200" preserveAspectRatio="xMidYMid meet" aria-labelledby="title desc" role="img">
      <title id="title">CONTENT</title>
      <desc id="desc">The word CONTENT rendered as bold condensed vector letters.</desc>

      <!-- Center the word within the 800px wide viewBox -->
      <g transform="translate(50,0)" fill="var(--fg)">
        <!-- Letter slot width: 100 (80 for letter, 20 for built-in spacing) -->

        <!-- C -->
        <g transform="translate(0,0)">
          <rect x="0"  y="20"  width="20" height="160" />
          <rect x="20" y="0"   width="60" height="20" />
          <rect x="20" y="180" width="60" height="20" />
        </g>

        <!-- O -->
        <g transform="translate(100,0)">
          <!-- Outer -->
          <rect x="0"  y="0"   width="80" height="200" />
          <!-- Inner “hole” -->
          <rect x="20" y="20"  width="40" height="160" fill="var(--bg)" />
        </g>

        <!-- N -->
        <g transform="translate(200,0)">
          <rect x="0"  y="0"   width="20" height="200" />
          <rect x="60" y="0"   width="20" height="200" />
          <polygon points="20,0 40,0 60,200 40,200" />
        </g>

        <!-- T -->
        <g transform="translate(300,0)">
          <rect x="0"  y="0"   width="80" height="20" />
          <rect x="30" y="20"  width="20" height="180" />
        </g>

        <!-- E -->
        <g transform="translate(400,0)">
          <rect x="0"  y="0"   width="20" height="200" />
          <rect x="20" y="0"   width="60" height="20" />
          <rect x="20" y="90"  width="50" height="20" />
          <rect x="20" y="180" width="60" height="20" />
        </g>

        <!-- N -->
        <g transform="translate(500,0)">
          <rect x="0"  y="0"   width="20" height="200" />
          <rect x="60" y="0"   width="20" height="200" />
          <polygon points="20,0 40,0 60,200 40,200" />
        </g>

        <!-- T -->
        <g transform="translate(600,0)">
          <rect x="0"  y="0"   width="80" height="20" />
          <rect x="30" y="20"  width="20" height="180" />
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
